<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Libres - eSIM Data Viewer & Top Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Space Grotesk & Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 3s infinite ease-in-out;
        }

        /* Custom flashy button style mimicking Button.svg */
        .btn-flashy {
            background: linear-gradient(#27272a, #27272a) padding-box,
                        linear-gradient(to right, #b7b5f5, #5fd0c0) border-box;
            border: 2px solid transparent;
            border-radius: 9999px;
            color: #f8fafc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .btn-flashy:hover {
            box-shadow: 0 10px 25px -5px rgba(95, 208, 192, 0.4), 0 8px 10px -6px rgba(183, 181, 245, 0.4);
            transform: translateY(-2px);
            color: #ffffff;
        }
        
        .btn-flashy:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        /* Custom Dropdown Scrollbar */
        #oxxo-dropdown-menu::-webkit-scrollbar {
            width: 6px;
        }
        #oxxo-dropdown-menu::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 8px;
        }
        #oxxo-dropdown-menu::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 8px;
        }
        #oxxo-dropdown-menu::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans font-light antialiased flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- 4G & 5G Network Support Top Banner -->
    <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white py-2 px-4 border-b border-indigo-900/50 shadow-xs">
        <div class="max-w-5xl mx-auto flex items-center justify-center text-xs">
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-1">
                    <span class="inline-flex items-center px-2 py-0.5 rounded bg-indigo-500/25 text-indigo-300 font-bold text-[10px] border border-indigo-400/30 tracking-wider font-mono">4G LTE</span>
                    <span class="text-indigo-400 font-bold">+</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded bg-emerald-500/25 text-emerald-300 font-bold text-[10px] border border-emerald-400/40 tracking-wider font-mono">5G ULTRA</span>
                </div>
                <span class="h-3 w-px bg-slate-700 hidden sm:inline-block"></span>
                <span class="font-medium text-slate-200 hidden sm:inline-block tracking-tight">
                    High-Speed Mobile Network Supported Nationwide
                </span>
            </div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="w-full z-30 pt-6 pb-2">
        <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center min-w-0 pr-2">
                <div class="flex flex-col justify-center min-w-0">
                    <a href="?" class="block">
                        <img src="LogoBold.svg" alt="Datos Libres" class="w-[200px] sm:w-[260px] object-contain object-left" id="header-title" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span style="display:none;" class="text-xl sm:text-2xl font-black tracking-tight text-slate-900 truncate">Datos Libres</span>
                    </a>
                    <p class="text-[14px] sm:text-[19px] font-bold tracking-wide mt-1.5 text-transparent bg-clip-text bg-gradient-to-r from-[#d3bdf8] via-[#a3d0ed] to-[#5fd0c0] leading-none truncate" id="header-subtitle">eSIM y Datos para celular</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="toggleEsimGuide()" class="btn-flashy inline-flex items-center px-3 sm:px-4 py-2 text-xs font-bold cursor-pointer">
                    <svg class="w-4 h-4 mr-1 sm:mr-2 text-[#5fd0c0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    eSIM Guide
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-grow space-y-6">
        
        <!-- Separated eSIM Lookup Box -->
        <div id="esim-lookup-card" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 shadow-2xs">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="5" y="4" width="14" height="16" rx="2" stroke-width="2"></rect>
                        <path d="M9 8h6M9 12h6M9 16h4" stroke-width="2" stroke-linecap="round"></path>
                        <path d="M3 8h2M3 12h2M3 16h2M19 8h2M19 12h2M19 16h2" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">eSIM Number Lookup</h2>
                    <p class="text-xs text-slate-500">Lookup eSIM data balance.</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full lg:w-auto">
                <div class="flex w-full sm:w-auto items-center gap-2">
                    <input type="text" id="manual-id-input" placeholder="Enter eSIM number..." class="w-full sm:w-64 px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-full focus:ring-2 focus:ring-[#5fd0c0] focus:border-[#5fd0c0] focus:bg-white focus:outline-none text-slate-800 font-mono transition-all" onkeydown="if(event.key==='Enter') loadManualId()">
                    <button onclick="loadManualId()" class="btn-flashy px-5 py-2.5 text-xs font-bold cursor-pointer shrink-0">
                        Load eSIM
                    </button>
                </div>
            </div>
        </div>

        <!-- Top Up Wrapper (Cards separated by gaps) -->
        <div id="topup-card" class="hidden flex flex-col gap-6">
            
            <!-- Card 1: Data Packages & Crypto -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-6">
                <!-- Section 1: Active eSIM Overview Banner -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                    <div class="space-y-1 w-full min-w-0">
                        <div class="flex items-center justify-between sm:justify-start space-x-2">
                            <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-indigo-600 text-white shadow-2xs font-mono">
                                <span>eSIM TOP UP</span>
                                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"></path></svg>
                            </span>
                            <span id="profile-status-badge" class="px-2.5 py-0.5 text-xs rounded-full bg-slate-200 text-slate-700 font-semibold font-mono">
                                Checking Status
                            </span>
                        </div>
                        <div class="flex items-center justify-between gap-x-3 pt-1.5 min-w-0">
                            <h2 class="text-2xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight font-sans truncate min-w-0" id="display-id">Loading eSIM...</h2>
                            
                            <button onclick="copyCurrentUrl()" title="Copy Direct eSIM Link" class="text-slate-400 hover:text-indigo-600 p-2 rounded-xl hover:bg-slate-100 transition cursor-pointer shrink-0">
                                <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8
